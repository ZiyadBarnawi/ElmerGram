<nav class="flex justify-center z-999">
  <div #dummy></div>
  <div class="navigation-card flex items-center justify-center gap-4 absolute">
    @for (item of menuItems; track $index) {
      <a
        routerLinkActive="tab--active"
        [routerLink]="item.routerLink"
        class="tab flex justify-center items-center"
      >
        <i style="font-size: 2.5rem" [class]="item.icon"></i>
      </a>
    }
  </div>
</nav>
