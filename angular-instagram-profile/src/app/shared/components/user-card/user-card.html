<p-card [style]="{ 'background-color': 'transparent', cursor: 'pointer' }">
  <div class="flex w-full">
    <div
      (click)="switchToSelectedUser(user()?.username!)"
      class="card flex flex-row gap-3 justify-start items-center hover:transform hover:scale-105 duration-200"
    >
      <p-avatar shape="circle" size="xlarge" image="{{ user()?.pfpUrl || 'pfp.png' }}" />
      <div class="flex flex-col">
        <p class="username w-fit text-xl lg:text-2xl font-semibold truncate! duration-500">
          {{ user()?.username }}
        </p>
        @if (showBio()) {
          <p class="bio sm:w-40 text-sm lg:text-lg truncate! duration-500">
            {{ user()?.bio }}
          </p>
        }
      </div>
    </div>
    <div class="card-button w-1/4 duration-500">
      @if (showFollowButton()) {
        <p-button
          [icon]="followableUser!.followed ? 'pi pi-times' : 'pi pi-plus'"
          [style]="{ 'font-size': '1.2rem' }"
          rounded="true"
          (onClick)="toggleFollow()"
          [severity]="followableUser!.followed ? 'danger' : 'primary'"
        />
      }
    </div>
  </div>
</p-card>
