<p-card
  [style]="{ 'background-color': 'transparent', cursor: 'pointer' }"
  (click)="switchToSelectedUser(user()?.username!)"
>
  <div
    class="card flex flex-row gap-3 justify-start items-center hover:transform hover:scale-105 duration-200"
  >
    <p-avatar shape="circle" size="xlarge" image="{{ user()?.pfpUrl || 'pfp.png' }}"></p-avatar>
    <div class="flex flex-col">
      <p class="username text-2xl font-semibold truncate!" [class.w-48]="!fluid()">
        {{ user()?.username }}
      </p>
      @if (showBio()) {
        <p class="bio text-lg truncate!" [class.w-48]="!fluid()">{{ user()?.bio }}</p>
      }
    </div>
    @if (showFollowButton()) {
      <p-button
        label="follow"
        [icon]="'pi pi-plus'"
        [style]="{ 'font-size': '1.2rem' }"
        rounded="true"
      />
    }
  </div>
</p-card>
