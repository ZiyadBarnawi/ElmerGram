<div
  (mouseover)="onMouseover()"
  (mouseout)="onMouseout()"
  class="relative z-10 inline-block w-full"
>
  <div
    #likes
    class="likes absolute z-50 whitespace-nowrap"
    animate.enter="enter-animation"
    [innerHTML]="post()?.likes! | likes: { testProp: 11, testProp2: 12 }"
  ></div>
  <img
    class="w-full! duration-500"
    (click)="toggleExpandedPost()"
    #img
    src="/{{ post()?.media }}"
    alt="🌻img"
  />
  <p-dialog
    [header]="'@' + post()?.username || 'Unknown User'"
    closable="true"
    appendTo="body"
    draggable="false"
    resizable="true"
    [modal]="true"
    [(visible)]="expandedPost"
    [dismissableMask]="true"
  >
    <div
      class="flex gap-4 justify-between items-stretch w-full"
      [style]="{
        height: '40rem',
      }"
    >
      <div class="flex flex-col max-w-sm">
        <p-image [src]="post()?.media" appendTo="body" preview="true" />
        <div class="flex gap-3">
          <span class="text-gray-400">Posted: {{ post()?.createdAt | date }}</span>
          <span [innerHTML]="post()?.likes! | likes"></span>
        </div>
        <div class="flex gap-4">
          <p-button
            size="large"
            appBounceUp
            [style]="{
              background: 'none',
              border: 'none',
            }"
            icon="pi pi-share-alt"
          />
          <p-button
            (click)="like()"
            size="large"
            appBounceUp
            [style]="{
              background: 'none',
              border: 'none',
            }"
            icon="pi pi-heart"
          />
          <p-button
            size="large"
            appBounceUp
            [style]="{
              background: 'none',
              border: 'none',
            }"
            icon="pi pi-comment"
          />
        </div>
      </div>
      <section class="flex flex-col justify-between h-full">
        <div class="flex flex-col gap-5 overflow-y-auto" [style]="{ 'min-height': 0 }">
          <drag-scroll [drag-scroll-x-disabled]="true">
            @for (comment of post()?.comments; track $index) {
              <div drag-scroll-item class="x-card p-1">
                <div class="flex items-center p-3 gap-3">
                  <div class="x-avatar">{{ comment.username[0] }}</div>
                  <div>
                    <h5 class="mb-0 font-semibold comment-usernmae text-2xl">
                      {{ comment.username }}
                    </h5>
                  </div>
                </div>

                <div class="px-3 pb-3">
                  <p class="mb-0 break-words text-wrap text-lg">
                    {{ comment.content }}
                  </p>
                </div>

                <div class="x-actions flex justify-end gap-3 items-center p-3">
                  <button class="btn-reply">
                    <svg
                      viewBox="0 0 16 16"
                      fill="currentColor"
                      height="16"
                      width="16"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M14 1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4.414A2 2 0 0 0 3 11.586l-2 2V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12.793a.5.5 0 0 0 .854.353l2.853-2.853A1 1 0 0 1 4.414 12H14a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"
                      />
                    </svg>
                    <span>{{ comment.replies }}</span>
                  </button>

                  <button class="btn-like">
                    <svg
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                      fill="none"
                      height="20"
                      width="20"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M20.84 4.61a5.5 5.5 0 00-7.78-.61l-.7.7-.7-.7a5.5 5.5 0 00-7.78.61c-2.19 2.36-2.12 6.14.18 8.55L12 21.35l8.22-8.19c2.3-2.41 2.37-6.19.18-8.55z"
                        stroke-width="2"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                      />
                    </svg>
                    <span>{{ comment.likes }}</span>
                  </button>

                  <button class="btn-share">
                    <svg
                      viewBox="0 0 16 16"
                      fill="currentColor"
                      height="16"
                      width="16"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M13.5 1a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M11 2.5a2.5 2.5 0 1 1 .603 1.628l-6.718 3.12a2.5 2.5 0 0 1 0 1.504l6.718 3.12a2.5 2.5 0 1 1-.488.876l-6.718-3.12a2.5 2.5 0 1 1 0-3.256l6.718-3.12A2.5 2.5 0 0 1 11 2.5m-8.5 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m11 5.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3"
                      />
                    </svg>
                  </button>
                </div>
              </div>
            }
          </drag-scroll>
        </div>
      </section>
    </div>
  </p-dialog>
</div>
