<div (mouseover)="onMouseover()" (mouseout)="onMouseout()" class="position-relative z-10">
  <div
    #likes
    class="likes position-absolute z-50 text-nowrap"
    animate.enter="enter-animation"
    [innerHTML]="post()?.likes! | likes: { testProp: 11, testProp2: 12 }"
  ></div>
  <img (click)="toggleExpandedPost()" #img src="/{{ post()?.media }}" alt="🌻img" />
  <p-dialog
    [header]="post()?.username || 'Unknown User'"
    [style]="{ width: '50rem' }"
    closable="true"
    appendTo="body"
    draggable="false"
    resizable="false"
    [modal]="true"
    [(visible)]="expandedPost"
    [dismissableMask]="true"
  >
    <div
      class="d-flex justify-content-between align-items-stretch w-100"
      [style]="{ height: '40rem' }"
    >
      <img [style]="{}" class="align-self-start" [src]="post()?.media" alt="post img" />
      <section class="d-flex flex-column justify-content-between">
        <div
          class="d-flex flex-column gap-5"
          [style]="{ height: '100%', width: '15rem', 'overflow-y': 'scroll' }"
        >
          <div class="d-flex justify-content-center gap-4">
            <p-avatar
              [style]="{ transform: 'scale(1.4)', overflow: 'visible' }"
              [image]="images[3]"
              shape="circle"
              size="xlarge"
            />
            <span
              [style]="{
                'font-size': '1.35rem',
                background: '#80808033',
                'text-align': 'center',
                'border-radius': '1.5rem',
                padding: '1rem',
              }"
              >Nice!!</span
            >
          </div>
          <div class="d-flex justify-content-center gap-4">
