<div (mouseover)="onMouseover()" (mouseout)="onMouseout()" class="position-relative z-10">
  <div #likes class="likes position-absolute z-50 text-nowrap" animate.enter="enter-animation" [innerHTML]="post()?.likes |likes: {testProp:11,testProp2:12}">
  </div>
  <img #img src="/{{ post()?.media }}" alt="🌻img" />
</div>
