<div class="flex justify-between mb-2">
  <svg
    [style]="{ transform: 'scale(1.5)' }"
    width="250"
    height="50"
    viewBox="0 0 600 150"
    xmlns="http://www.w3.org/2000/svg"
  >
    <defs>
      <linearGradient id="magicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color: #2dd4bf; stop-opacity: 1" />
        <stop offset="100%" style="stop-color: #5eead4; stop-opacity: 1" />
      </linearGradient>
      <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      <filter id="particleGlow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="2" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>

    <!-- Magical Lotus/Shard Mark -->
    <g transform="translate(20, 25)">
      <!-- Smooth Lotus Petal Shards -->
      <path
        d="M50 10 Q70 40, 50 70 Q30 40, 50 10"
        fill="url(#magicGradient)"
        opacity="0.9"
        filter="url(#softGlow)"
      >
        <animateTransform
          attributeName="transform"
          type="translate"
          values="0,0; 0,-3; 0,0"
          dur="4s"
          repeatCount="indefinite"
        />
      </path>
      <path d="M50 70 Q80 80, 90 50 Q60 40, 50 70" fill="url(#magicGradient)" opacity="0.7">
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="0 50 70; 5 50 70; 0 50 70"
          dur="5s"
          repeatCount="indefinite"
        />
      </path>
      <path d="M50 70 Q20 80, 10 50 Q40 40, 50 70" fill="url(#magicGradient)" opacity="0.7">
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="0 50 70; -5 50 70; 0 50 70"
          dur="5s"
          repeatCount="indefinite"
        />
      </path>

      <!-- Central Core -->
      <circle cx="50" cy="55" r="6" fill="#ffffff" filter="url(#softGlow)">
        <animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
      </circle>

      <!-- Firefly/Spark Particles -->
      <circle cx="20" cy="30" r="1.5" fill="#5eead4" filter="url(#particleGlow)">
        <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="cy" values="30;20;30" dur="4s" repeatCount="indefinite" />
        <animate attributeName="cx" values="20;25;20" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="80" cy="40" r="1.2" fill="#ffffff" filter="url(#particleGlow)">
        <animate
          attributeName="opacity"
          values="0;0.8;0"
          dur="3s"
          repeatCount="indefinite"
          delay="1s"
        />
        <animate attributeName="cy" values="40;50;40" dur="5s" repeatCount="indefinite" />
      </circle>
      <circle cx="40" cy="90" r="1" fill="#2dd4bf" filter="url(#particleGlow)">
        <animate
          attributeName="opacity"
          values="0;1;0"
          dur="2s"
          repeatCount="indefinite"
          delay="0.5s"
        />
        <animate attributeName="cy" values="90;80;90" dur="3.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Artist Style Wordmark (Elegant, Slender Sans-Serif) -->
    <text
      x="130"
      y="85"
      font-family="'Plus Jakarta Sans', sans-serif"
      font-size="54"
      font-weight="300"
      fill="#ffffff"
      letter-spacing="2"
    >
      ELMER
      <tspan fill="url(#magicGradient)" font-weight="600">GRAM</tspan>
    </text>

    <!-- Subtle decorative underline for artist feel -->
  </svg>

  <input
    (input)="pop.show($event)"
    [style]="{
      'border-radius': '1.5rem',
      padding: '0.8rem 1.5rem',
      'background-color': '',
      opacity: '0.8',
      'font-size': '1.2rem',
    }"
    variant="outlined"
    [formControl]="searchForm"
    class="h-fit w-1/3"
    type="text"
    pInputText
    placeholder="Search for users..."
  />

  <p-popover
    [style]="{ 'background-color': '#18181b64' }"
    dismissable="true"
    baseZIndex="99999"
    #pop
    class="flex flex-col items-center justify-center"
  >
    <div
      class="cards-container"
      [style]="{ 'background-color': '#18181b64', 'max-height': '20rem', 'overflow-y': 'scroll' }"
    >
      @for (user of users; track $index) {
        <app-user-card [user]="user" [fluid]="true" />
      }
    </div>
  </p-popover>
  <div class="flex gap-5 mx-5">
    <p-button variant="text">
      <p-overlaybadge
        size="xlarge"
        [style]="{ 'font-size': '1rem', padding: '0.5rem', overflow: 'visible' }"
        value="+9"
      >
        <i class="pi pi-bell" style="font-size: 2rem"></i>
      </p-overlaybadge>
    </p-button>
    <p-button
      (onClick)="openSignUpDialog()"
      (onClick)="userService.visibleSignupDialog = true"
      variant="outlined"
      size="large"
      class="p-button-dialog"
      label="Sign up"
    />
  </div>
</div>
