<p-tabs value="0" class="">
  <p-tablist>
    <p-tab value="0" class="pi pi-video"></p-tab>
    <p-tab value="1" class="pi pi-bookmark"></p-tab>
    <p-tab value="2" class="pi pi-user"></p-tab>
  </p-tablist>
  <p-tabpanels>
    <p-tabpanel value="0">
      <div class="posts-container flex flex-wrap gap-4 justify-center w-full">
        @for (post of shuffledPosts; track $index) {
          <div class="post sm:w-1/3 md:w-1/4 lg:w-1/5 duration-500">
            <app-post [post]="post" />
          </div>
        }
      </div>
    </p-tabpanel>
    <p-tabpanel value="1">
      <!-- TODO: Actual saved posts -->
      <div class="posts-container flex flex-wrap gap-4 justify-center w-full">
        @for (post of shuffledSavedPosts; track $index) {
          <div class="post sm:w-1/3 md:w-1/4 lg:w-1/5 duration-500">
            <app-post [post]="post" />
          </div>
        }
      </div>
    </p-tabpanel>
    <p-tabpanel value="2">
      <div class="flex flex-wrap gap-4">
        @for (user of (user$ | async)!.following; track $index) {
          <div [class]="`profile-card w-full text-center profile-${$index} duration-500`">
            <!-- Avatar icon -->
            <div class="profile-icon mb-3">
              <p-avatar [image]="user.pfpUrl" shape="circle" size="xlarge" />
            </div>
            <!-- Name & handle -->
            <h5 class="profile-name font-bold text-xl lg:text-2xl duration-500">
              {{ user.username }}
            </h5>
            <p class="profile-bio text-xl">{{ user.bio }}</p>
          </div>
        }
      </div>
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>
