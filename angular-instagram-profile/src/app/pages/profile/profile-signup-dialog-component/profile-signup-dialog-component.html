<p-dialog
  header="Sign up"
  [modal]="true"
  [(visible)]="userService.visibleSignupDialog"
  (onHide)="userService.previousRoute({ replaceUrl: true })"
  styleClass="signup-dialog w-full max-w-[45rem] sm:max-w-[42rem] lg:max-w-[48rem]"
>
  <p-stepper [value]="1">
    <p-step-list>
      <p-step [value]="1">Account Information</p-step>
      <p-step [value]="2">Verification</p-step>
    </p-step-list>
    <p-step-panels>
      <!--! Account Information  -->
      <p-step-panel [value]="1">
        <ng-template #content let-activateCallback="activateCallback">
          <form
            [formGroup]="userService.userForm"
            class="h-auto overflow-visible w-full max-w-[42rem] mx-auto space-y-4 px-2 sm:px-4 md:px-6"
            action=""
          >
            <div class="my-5 flex flex-col items-center justify-center">
              <div class="file-input-div relative flex justify-center items-center">
                <input
                  [formControl]="userService.userForm.controls.pfpUrl"
                  class="file-input"
                  name="file"
                  type="file"
                />
                <i class="pi pi-upload" [style]="{ 'font-size': '3rem' }"></i>
              </div>
            </div>
            <p-input-group class="p-2 my-2">
              <p-inputgroup-addon><i class="pi pi-user"></i> </p-inputgroup-addon>
              <input
                formControlName="username"
                pInputText
                type="text"
                name="username"
                placeholder="Username"
                class="w-full"
              />
            </p-input-group>

            <p-input-group class="p-2 my-2">
              <p-inputgroup-addon>
                <p-button
                  (onClick)="userService.useEmail = true"
                  class="h-full"
                  [disabled]="userService.useEmail === true"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="#fefbfb"
                    viewBox="0 0 256 256"
                  >
                    <path
                      d="M128,24a104,104,0,0,0,0,208c21.51,0,44.1-6.48,60.43-17.33a8,8,0,0,0-8.86-13.33C166,210.38,146.21,216,128,216a88,88,0,1,1,88-88c0,26.45-10.88,32-20,32s-20-5.55-20-32V88a8,8,0,0,0-16,0v4.26a48,48,0,1,0,5.93,65.1c6,12,16.35,18.64,30.07,18.64,22.54,0,36-17.94,36-48A104.11,104.11,0,0,0,128,24Zm0,136a32,32,0,1,1,32-32A32,32,0,0,1,128,160Z"
                    ></path>
                  </svg>
                </p-button>
              </p-inputgroup-addon>
              @if (userService.useEmail) {
                <input
                  size="large"
                  type="text"
                  formControlName="email"
                  pInputText
                  class="inputmask-credentials w-full"
                  placeholder="Email Address"
                />
              } @else {
                <p-inputmask
                  [mask]="'(+999)99-999-9999'"
                  size="large"
                  type="text"
                  fluid="true"
                  formControlName="phoneNumber"
                  class="inputmask-credentials w-full"
                  placeholder="Phone Number"
                />
              }
              <p-inputgroup-addon>
                <p-button
                  (onClick)="userService.useEmail = false"
                  icon="pi pi-phone"
                  class="h-full"
                  [disabled]="userService.useEmail !== true"
                />
              </p-inputgroup-addon>
            </p-input-group>

            <div
              class="div-date-of-birth flex flex-col sm:flex-row justify-center items-stretch gap-4 my-2 p-2"
            >
              <p-input-group class="input-group-date-of-birth flex-1 min-w-0">
                <p-inputgroup-addon>
                  <i class="pi pi-calendar"></i>
                </p-inputgroup-addon>
                <p-date-picker
                  appendTo="body"
                  placeholder="Your Birth Date"
                  formControlName="dateOfBirth"
                  class="date-picker-date-of-birth w-full"
                  [showButtonBar]="true"
                  size="large"
                  dateFormat="dd/mm/yy"
                  [maxDate]="userService.today"
                />
              </p-input-group>
              <p-selectbutton
                [options]="userService.genderOptions"
                class="selectbutton-gender w-full sm:w-auto"
                formControlName="gender"
              />
            </div>
            <div class="flex flex-col sm:flex-row justify-center items-stretch gap-3 p-2 my-2">
              <p-password
                formControlName="password"
                [toggleMask]="true"
                placeholder="Password"
                [size]="'large'"
                class="w-full"
              />
              <p-password
                feedback="false"
                formControlName="confirmPassword"
                [toggleMask]="false"
                placeholder="Conform Password"
                [size]="'large'"
                class="w-full"
              />
            </div>
            <div class="p-2 space-y-3">
              <p-input-group class="w-full flex my-2">
                <p-inputgroup-addon>
                  <i class="pi pi-search" (click)="userService.updateSuggestedCities($event)"></i>
                </p-inputgroup-addon>
                <p-autocomplete
                  formControlName="city"
                  [suggestions]="userService.suggestedCities"
                  appendTo="body"
                  placeholder="Select your city"
                  (completeMethod)="userService.updateSuggestedCities($event)"
                  class="w-full"
                />
              </p-input-group>
              <div class="flex flex-col">
                <label for="bio" class="mb-2">bio</label>
                <textarea
                  formControlName="bio"
                  rows="4"
                  cols="30"
                  pTextarea
                  class="text-white min-h-[6rem]"
                ></textarea>
              </div>
            </div>

            <div
              class="button-row flex flex-col justify-center items-center gap-3 my-4 w-full flex-wrap"
            >
              <p-button
                severity="secondary"
                (onClick)="userService.visibleSignupDialog = false"
                routerLink="../"
                label="Cancel"
                styleClass="w-full sm:w-auto"
              ></p-button>
              <p-button
                severity="success"
                label="Next"
                (onClick)="activateCallback(2)"
                styleClass="w-full sm:w-auto"
              ></p-button>
            </div>
          </form>
        </ng-template>
      </p-step-panel>
      <!--! Account Type  -->

      <!--! Verification  -->
      <p-step-panel [value]="2">
        <ng-template #content let-activateCallback="activateCallback">
          <form [formGroup]="userService.userForm" class="w-full space-y-4 px-2 sm:px-4 md:px-6">
            <div class="w-full h-full flex flex-col items-center justify-center items-center gap-4">
              <span class="text-center">Enter the OTP we've just sent to you </span>
              <div class="flex justify-center w-full">
                <p-inputotp
                  size="large"
                  [integerOnly]="true"
                  [length]="4"
                  formControlName="otp"
                  class="w-full max-w-xs"
                />
              </div>
            </div>
            <div
              class="button-row flex flex-col justify-center items-center gap-3 my-4 w-full flex-wrap"
            >
              <p-button
                label="Cancel"
                (onClick)="userService.visibleSignupDialog = false"
                severity="secondary"
                styleClass="w-full sm:w-auto"
              />
              <p-button
                label="Submit"
                (onClick)="submitForm()"
                severity="success"
                styleClass="w-full sm:w-auto"
              />
            </div>
          </form>
        </ng-template>
      </p-step-panel>
    </p-step-panels>
  </p-stepper>
</p-dialog>
