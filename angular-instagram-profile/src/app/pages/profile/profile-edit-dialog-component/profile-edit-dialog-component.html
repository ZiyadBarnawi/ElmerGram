<p-dialog
  [modal]="true"
  [(visible)]="userService.visibleEditDialog"
  (onHide)="userService.previousRoute({ replaceUrl: true })"
>
  <form [formGroup]="userService.userForm" class="h-auto overflow-visible space-y-4">
    <div class="flex flex-col justify-center items-center">
      <p-avatar
        [shape]="'circle'"
        [image]="userService.user()?.pfpUrl || Images[6]"
        class="img-pfp mb-3 self-center"
      />
      <p-fileupload
        name="demo"
        url="https://www.primefaces.org/cdn/api/upload.php"
        [multiple]="false"
        accept="image/*"
        maxFileSize="1000000"
        mode="basic"
        (onUpload)="userService.uploadFile($event, userService.userForm.controls.pfpUrl)"
        class="fileupload-edit-pfp"
        chooseIcon="pi pi-upload"
        chooseLabel=" "
        [showCancelButton]="false"
        [showUploadButton]="true"
        [auto]="true"
        [chooseButtonProps]="{
          outlined: true,
          rounded: true,
        }"
      >
      </p-fileupload>
    </div>
    <p-input-group class="p-2">
      <p-inputgroup-addon><i class="pi pi-user"></i> </p-inputgroup-addon>
      <input
        [formControl]="userService.userForm.controls.username"
        class=""
        pInputText
        type="text"
        name="username"
        placeholder="Username"
        [placeholder]="userService.user()?.username"
      />
    </p-input-group>

    <p-input-group class="p-2">
      <p-inputgroup-addon>
        <p-button
          (onClick)="userService.useEmail = true"
          class="h-full"
          [disabled]="userService.useEmail === true"
          ><svg
            class=""
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="#fefbfb"
            viewBox="0 0 256 256"
          >
            <path
              d="M128,24a104,104,0,0,0,0,208c21.51,0,44.1-6.48,60.43-17.33a8,8,0,0,0-8.86-13.33C166,210.38,146.21,216,128,216a88,88,0,1,1,88-88c0,26.45-10.88,32-20,32s-20-5.55-20-32V88a8,8,0,0,0-16,0v4.26a48,48,0,1,0,5.93,65.1c6,12,16.35,18.64,30.07,18.64,22.54,0,36-17.94,36-48A104.11,104.11,0,0,0,128,24Zm0,136a32,32,0,1,1,32-32A32,32,0,0,1,128,160Z"
            ></path>
          </svg>
        </p-button>
      </p-inputgroup-addon>
      @if (userService.user()?.email) {
        <input
          size="large"
          type="text"
          [formControl]="userService.userForm.controls.email"
          pInputText
          class="inputmask-credentials"
          [placeholder]="userService.user()?.email"
        />
      } @else {
        <p-inputmask
          [mask]="'(+999)99-999-9999'"
          size="large"
          type="text"
          [formControl]="userService.userForm.controls.phoneNumber"
          pInputText
          class="inputmask-credentials"
          [placeholder]="userService.user()?.phoneNumber"
        />
      }
      <p-inputgroup-addon>
        <p-button
          (onClick)="userService.useEmail = false"
          icon="pi pi-phone"
          class="h-full w-full"
          [disabled]="userService.useEmail === false"
        />
      </p-inputgroup-addon>
    </p-input-group>

    <div class="w-full gap-3 flex justify-center items-center mb-3">
      <p-input-group class="flex-1 px-0 py-2">
        <p-inputgroup-addon>
          <i class="pi pi-calendar"></i>
        </p-inputgroup-addon>
        <p-date-picker
          appendTo="body"
          placeholder="Your Birth Date"
          [formControl]="userService.userForm.controls.dateOfBirth"
          class=""
          [showButtonBar]="true"
          size="large"
          dateFormat="dd/mm/yy"
          [maxDate]="userService.today"
          placeholder="{{ userService.user()?.dateOfBirth | date }}"
        />
      </p-input-group>
      <p-selectbutton
        [options]="userService.genderOptions"
        class="selectbutton-gender"
        [formControl]="userService.userForm.controls.gender"
      />
    </div>

    <p-input-group class="w-full flex my-2">
      <p-inputgroup-addon>
        <i class="pi pi-search" (click)="userService.updateSuggestedCities($event)"></i>
      </p-inputgroup-addon>
      <p-autocomplete
        [formControl]="userService.userForm.controls.city"
        [suggestions]="userService.suggestedCities"
        appendTo="body"
        placeholder="Select your city"
        (completeMethod)="userService.updateSuggestedCities($event)"
      />
    </p-input-group>
    <div class="flex flex-col my-2">
      <label for="bio" class="mb-2">bio</label>
      <textarea
        rows="4"
        cols="30"
        pTextarea
        [formControl]="userService.userForm.controls.bio"
      ></textarea>
    </div>

    <div class="flex justify-center items-center gap-5 my-4">
      <p-button
        label="Cancel"
        (onClick)="userService.visibleEditDialog = false"
        severity="secondary"
      />
      <p-button label="Save" (onClick)="submitForm()" severity="success" />
    </div>
    <p-divider />
    <div class="d-flex flex-column justify-content-center align-items-center gap-4">
      <h2 class="text-danger">Danger Zone</h2>
      <p-button
        label="Delete User"
        severity="danger"
        (onClick)="userService.visibleDeleteDialog = true"
        routerLink="/profile/{{ userService.user()?.username }}/delete"
      />
    </div>
  </form>
</p-dialog>
